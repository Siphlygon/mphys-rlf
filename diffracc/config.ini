[DEFAULT]
;size of the folder used to segment generated and dataset images into, or None to do no segmentation.
FOLDER_SIZE = 10000

### dataset parameters ###
;subdirectory for the Vicanek Martinez et al. 2024 cutouts
DATASET_SUBDIR = dataset
;how many fits images from the VM dataset to convert, or None to convert all
VM_FITS_COUNT_CUTOFF = None
;whether or not to unscale images using the stored peak flux values (e.g. if images are normalized 0-1)
DO_UNSCALING = True

### generation parameters ###
;subdirectory to save generated images to
GENERATED_SUBDIR = generated
;batch size for image generation, to avoid OOM errors
BATCH_SIZE = 100
;number of timesteps to use in image generation
TIMESTEPS = 25
;whether or not to use the CPU for image generation instead of attempting to use CUDA
USE_CPU = False
;the number of samples to generate
N_SAMPLES = 10000
;whether or not to preserve image values on generation. If false images are scaled 0-1
PRESERVE_VALUES = True
;the name of the model to use to generate the images, as stored in model_results/<NAME>/parameters_<NAME>.pt and the associated config
MODEL_NAME = LOFAR_model
;path to training data for the model - if None assume LOFAR_DATA_PATH
TRAIN_DATA_PATH = None
;whether or not the model has the additional context variable 'largest angular size'
LAS_CONDITIONING_ENABLED = False
;the distribution of peak fluxes of the generated images, one of dataset, loguniform, or uniform
DISTRIBUTION = dataset
;upper bound of peak flux (Jy/beam) for uniform/loguniform generation
UPPER_BOUND = 0
;lower bound of peak flux (Jy/beam) for uniform/loguniform generation
LOWER_BOUND = 0

### completeness correction parameters ###
;the sigma threshold to use for the detection criteria, in units of the local noise
DETECTION_SIGMA_THRESHOLD = 5
;the number of flux bins to use in estimating the completeness correction
COMPLETENESS_FLUX_BINS = 15
;the minimum flux for completeness estimation, in log(mJy/beam)
COMPLETENESS_MIN_LOG_FLUX = -1
;the maximum flux for completeness estimation, in log(mJy/beam)
COMPLETENESS_MAX_LOG_FLUX = 1
;the number of noise patches to apply to each dataset image to estimate the completeness correction
N_NOISE_PATCHES = 5
;the desired percentage of the data in the final rms distribution, removing from the highest rms values first.
;this distribution has a very long tail and including too much of the data will lead to poorer resolution around the peak
RMS_PERCENTAGE_THRESHOLD = 0.95

### radio luminosity function parameters ###
;lowercase h, where the hubble constant today is H_0 = h * 100 km/(s*MPc)
h = 0.70
;temperature of the CMB today, in kelvin
Tcmb0 = 2.275
;matter density of the universe today
Om0 = 0.3
;redshift bin size
dz = 0.1
;luminosity bin count
LUM_BINS = 16
;number of points to use in the interpolation approximation of comoving volume to redshift
N_INTERP_PTS = 1000
;number of mock points to generate to estimate integral across luminosity-redshift bin using monte carlo for page & carrera calculation
N_MC_PTS_PC = 1000000
; as above but for 1/vmax calculation; recommended to be at least 10x smaller than the above, as Vmax has many more points to calculate
N_MC_PTS_VMAX = 100000
;spectral index to use for the k-correction, typically -0.7 for AGN
SPECTRAL_INDEX = -0.7
;minimum Z (redshift) to consider in RLF calculation
Z_MIN = 0.01
;maximum Z (redshift) to consider in RLF calculation
Z_MAX = 1.2
;minimum luminosity to plot, to the power 10 (min lum = 10**L_MIN)
L_MIN = 21
;maximum luminosity to plot, to the power 10 (max lum = 10**L_MAX)
L_MAX = 29

;whether or not to use the bins from Hardcastle et al. 2025 and overwrite dz - takes precedence over de Jong z bins
HARDCASTLE_Z_BINS = True
;whether or not to use the bins from de Jong et al 2023 and overwrite dz
DEJONG_Z_BINS = False



