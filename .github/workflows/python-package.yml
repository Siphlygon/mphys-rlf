# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
name: CI tests

on:
  workflow_dispatch:
  push:
    branches: 
      - '*' # run on all
  pull_request:
    branches: 
      - '*'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the whole matrix if one Python version fails — we want to
      # see which versions break.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    name: Python ${{ matrix.python-version }} tests
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}  
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install DiffRACC and dependencies
        # Pulls pytest from [project.optional-dependencies].test in pyproject.toml
        # and installs DiffRACC itself (editable) so the tests can import it.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run tests with pytest
        run: |
          python -m pytest --cov=diffracc -v